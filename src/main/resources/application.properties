# qits-docs — the reading surface over qits-artifacts' docs repository.
#
# This service holds NO state: no datasource, no Flyway, no persistence unit, no cache. Everything
# it answers it asks qits-artifacts for, which is why the whole of its configuration is one
# address and two deadlines.

# The one thing it talks to: qits-artifacts' ADDRESS. Scheme, host, port, NO path. The repository path
# (/artifacts/docs/docs) is DocsUpstream.REPOSITORY_PATH and is composed onto this in the code that
# dials it: the address is estate topology and only the platform knows it per environment, while
# the path is this service's own knowledge of its peer's API. A deployment that could set the path
# could point this reader at a repository nothing publishes into.
#
# TRANSITIONAL, until qits-bootstrap's EXTRAS block for qits-docs is deleted: a deployed container
# still receives the old path-bearing value, and DocsUpstream.storeRoot appends nothing when the
# configured URL already carries a path. That branch goes when the block does.
#
# THE STORE'S EDGE HOST (qits-1419, feature qits-1406): every service dials its peers at
# https://<label>.qits.<domain>, and qits-artifacts' label is `registry` (its deployments.yml
# `host:`). The same name answers from inside the platform network and from anywhere else, so the
# wire alias <env>-qits-artifacts is no longer an address this service is handed, and the platform
# project has no environment label — QITS_ENVIRONMENT never appears here. QITS_DOMAIN is injected
# into every container by qits-deployments and carries NO default: without it the service refuses
# to start rather than dialling a half name like `registry.qits.`.
#
# The edge refuses an anonymous read on that vhost (qits.edge.auth.anonymous-read-apps ships empty
# and is not set live), so every request carries this service's own bearer — the `qits` oidc client
# below, DocsBearer.
qits.docs.artifacts-url=https://registry.qits.${QITS_DOMAIN}
# A local run has no deployer to inject the domain; it reads no store unless told where one is.
%dev.QITS_DOMAIN=localhost

# --- the token this service PRESENTS (qits-1419; the qits-githost pattern, qits-1330) -------------
# ONE named client, `qits`, carries the outbound identity this service has: its own `qits:system`
# bearer, minted by client credentials. DocsBearer asks it for the token every read of
# qits-artifacts carries. It is quarkus-oidc-client alone — no tenant, no inbound check: this
# service still validates nothing, the edge in front of it does.
#
# Its id, secret and idp address are this application's own qits-idp service client, and they come
# from the deployer: .config/qits/deployments.yml declares `resources: idp:client`, so qits-deployments
# provisions the client (id `<env>-qits-docs`), stores its secret the way it stores a database
# password, and injects QITS_RESOURCE_IDP_URL, QITS_RESOURCE_IDP_CLIENT_ID and
# QITS_RESOURCE_IDP_CLIENT_SECRET. Reference the raw env names inside `${…}`, never a dotted key.
#
# The fallbacks only decide anything where no deployer started the process: the idp through the
# edge, https://idp.qits.<QITS_DOMAIN>/idp, never a wire alias, and QITS_DOMAIN with no default of
# its own; the client id `dev-qits-docs`, and an empty secret, so a token request is refused rather
# than presenting somebody else's credential.
#
# Discovery and early token acquisition are off, so building the client dials nothing: the first
# token request is the first contact. pacts/qits-docs-service_qits-idp-service.json rows that
# request (issueToken), and IdpTokenMintPactTest runs it through this very client.
quarkus.oidc-client.qits.auth-server-url=${QITS_RESOURCE_IDP_URL:https://idp.qits.${QITS_DOMAIN}/idp}
quarkus.oidc-client.qits.discovery-enabled=false
quarkus.oidc-client.qits.token-path=token
quarkus.oidc-client.qits.client-id=${QITS_RESOURCE_IDP_CLIENT_ID:dev-qits-docs}
quarkus.oidc-client.qits.credentials.secret=${QITS_RESOURCE_IDP_CLIENT_SECRET:}
quarkus.oidc-client.qits.grant.type=client
# One audience for every service: qits-platform.
quarkus.oidc-client.qits.grant-options.client.audience=qits-platform
quarkus.oidc-client.qits.early-tokens-acquisition=false
# On wherever the deployer runs it. Off under %dev and %test, so a suite or a local run never dials
# an idp; IdpTokenMintPactTest turns it on against a pact mock server.
quarkus.oidc-client.qits.client-enabled=true
%dev.quarkus.oidc-client.qits.client-enabled=false
%test.quarkus.oidc-client.qits.client-enabled=false

# Connect fast, read patiently. The read deadline bounds the response HEAD rather than the transfer
# — a bundle's largest file is streamed, not buffered — so it can be short enough that an
# unreachable store is a prompt 502 without making a large font a timeout.
qits.docs.connect-timeout=PT2S
qits.docs.request-timeout=PT30S

# The machine surface stays under the /docs segment. The edge routes every `routes:` prefix of
# every application on every host, so /docs/** reaches this service wherever it is asked for — and
# the segment is what tells the two planes apart on this service's own host.
quarkus.http.non-application-root-path=/docs/q

# --- the API document -------------------------------------------------------------------------
# Served at /docs/q/openapi — under non-application-root-path above, not a REST path. swagger-ui
# stays off (quarkus.swagger-ui.always-include is NOT set, so it exists in dev mode only): this
# service documents itself for its callers' pacts, not for a browser.
#
# The routes are Vert.x, not JAX-RS, so no annotation describes them. The doors other qits
# repositories call (the catalog under /docs/api and the bundle reads) are declared in
# META-INF/openapi.yaml, which SmallRye serves, so each has the operationId its golden masters and
# pacts cite. The redirects and the client stay out: a browser follows them, no qits caller does.
quarkus.smallrye-openapi.info-title=qits-docs API

# The client, at the ROOT of this service's host (docs.<env>.<domain>). The platform's recipe is in
# docs/project-setup-quinoa-angular.md in the qits monorepo.
#
# The segment is spelled THREE times now and they move together: this file's
# non-application-root-path above, DocsPaths.BASE in the code, and `routes:` in
# .config/qits/deployments.yml. The client no longer spells it at all — its baseHref is `/`, because
# it is what this host serves.
quarkus.quinoa.ui-root-path=/
# Deep links (/read/..., /<slug>/<category>/<repo>/...) fall back to index.html so the Angular
# router owns them across a reload.
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.build-dir=dist/qits-spa-docs/browser

# SET, not left to the derivation, and the reason is this service's whole shape. Quinoa derives the
# ignore list from quarkus.rest.path and quarkus.http.non-application-root-path — and EVERY route
# here is a literal Vert.x route outside both. Left unset, a mistyped bundle path would answer 200
# with index.html, and the client would render its own shell where a stylesheet was asked for.
#
# Values are matched after ui-root-path is stripped, and the ui root is now `/` — so they are
# ABSOLUTE. One entry covers the whole machine surface, because /docs is a prefix match: the bundle
# wire (/docs/<site>/-/<version>/...), the catalog (/docs/api) and the framework root (/docs/q) are
# all under it.
#
# The reader is NOT under it any more. It lives at /read/** on this host, outside the segment, so
# the fall-through that serves the client is what answers it.
quarkus.quinoa.ignored-path-prefixes=/docs

# The readiness endpoint the deployment's health gate curls: /docs/q/health/ready.
# It is the stock one deliberately — this service has no state whose health could differ from "the
# process is up", and a check that dialled qits-artifacts would take this container down
# for an outage it is designed to survive by answering 502.

# OTLP to qits-observability, THROUGH THE EDGE (epic qits-428). The extension instruments; the
# exporters are qits-telemetry-core's CDI beans, built on OpenTelemetry's upstream OTLP/HTTP
# builders, whose header supplier attaches the `qits` oidc client's CURRENT bearer (the same client
# DocsBearer reads, above) on every export. The edge refuses an anonymous POST to the receiver's
# vhost, and Quarkus' own exporter takes only static headers, which is why it is replaced.
#
# The receiver's address is the module's default, its edge host:
#   qits.telemetry.endpoint=https://observability.qits.${QITS_DOMAIN}/observability/api/otel
# QITS_DOMAIN has no default; the key is read only when the SDK builds the exporters, so %dev and
# %test (SDK off, below) never need it. /v1/{traces,logs,metrics} is appended by the module.
#
# qits.observability.url and quarkus.otel.exporter.otlp.endpoint/.protocol are GONE: with this jar
# on the classpath none of Quarkus' own OTLP exporters is ever built, so they reached nothing.
quarkus.otel.service.name=qits-docs

# The three signals through the CDI exporters. `cdi` is Quarkus' default for all three; spelled out
# so that a changed default is a diff and not a silence.
quarkus.otel.traces.exporter=cdi

# Logs ride the CDI log exporter — traces are on by default and were, for a while, the only signal
# this service exported, which is why it appeared in nothing qits-observability lists.
#
# THE THREE LOGS KEYS BELOW ARE SPELLED OUT THOUGH TWO OF THEM ARE QUARKUS DEFAULTS
# (handler.enabled, exporter). The OTel logging integration is still PREVIEW, so a changed default
# is a version away — and what it would change is the whole of what ships this process's logs:
# green build, no error, no records. Written down it is a diff; left to the default it is a silence.
#
# `cdi` routes the records at qits-telemetry-core's LogRecordExporter bean; Quarkus builds its own
# only when bean discovery finds none. `handler.enabled` is the JBoss Log Manager handler that turns
# an ordinary org.jboss.logging.Logger call into an OTLP record — without it the other keys
# describe a pipe nothing enters.
#
# `level` is the ONE non-default here (Quarkus ships ALL) and it is an OUTBOUND FLOOR, a second
# gate: per-category quarkus.log levels still decide which records exist, this decides which of
# them leave. Console logging is untouched either way — the OTel handler is an ADDITIONAL copy,
# never the only one, so a container's stdout stays the fallback when the receiver is down.
#
# That all three signals really leave a packaged process, carrying the bearer, is proven here by
# telemetry/TelemetryExportIT (against the native binary in a -Dnative verify);
# telemetry/OtelLogConfigTest pins the keys.
quarkus.otel.logs.enabled=true
quarkus.otel.logs.handler.enabled=true
quarkus.otel.logs.exporter=cdi
quarkus.otel.logs.level=INFO

# Metrics too, and `enabled` is not optional: metrics are OFF by default in Quarkus, so without it
# the third signal never leaves and the observability UI has nothing to plot.
quarkus.otel.metrics.enabled=true
quarkus.otel.metrics.exporter=cdi

# Dark in dev and test, the platform's convention: a suite must dial nothing. With the SDK off the
# exporters are never built, so neither profile needs QITS_DOMAIN or the oidc client for telemetry.
%dev.quarkus.otel.sdk.disabled=true
%test.quarkus.otel.sdk.disabled=true

# The native binary is `qits-docs`, not `qits-docs-runner`, so the process is
# identifiable in `ps` and `docker top`. This name is spelled a SECOND time in docker/Dockerfile's
# COPY line, and the two move together — a mismatch is a runtime stage that copies a path that does
# not exist, which fails the image build rather than shipping something broken, but fails it after
# the multi-minute native compile.
quarkus.package.output-name=qits-docs

# THE SECOND HALF, and it is not optional: `output-name` alone still appends `-runner`, so the
# native build emits qits-docs-runner and the runtime stage's COPY fails on a path that
# does not exist — after the native compile has already been paid for. Both siblings carry this pair;
# copying only the first line is how this was found. The key says `jar.` and governs the native
# executable's name too.
quarkus.package.jar.add-runner-suffix=false
